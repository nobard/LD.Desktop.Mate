name: Build release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Base version without v, for example 1.2.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: mate-release-${{ github.ref_name }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build Mate from ${{ github.ref_name }}
    runs-on: windows-2025
    timeout-minutes: 25

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      VELOPACK_VERSION: 1.2.0
      BASE_VERSION: ${{ inputs.version }}
      VPK_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Prepare release metadata
        id: release
        shell: pwsh
        run: |
          if ($env:BASE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
              throw 'Version must use the Major.Minor.Patch format, for example 1.2.0.'
          }

          $isPrerelease = $env:GITHUB_REF_NAME -ne 'main'
          if ($isPrerelease) {
              $branch = $env:GITHUB_REF_NAME.ToLowerInvariant()
              $branch = [Regex]::Replace($branch, '[^0-9a-z-]+', '-').Trim('-')
              if ([string]::IsNullOrWhiteSpace($branch)) {
                  $branch = 'branch'
              }
              if ($branch.Length -gt 32) {
                  $branch = $branch[..31].TrimEnd('-')
              }

              $version = "$env:BASE_VERSION-beta.$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT.$branch"
              $channel = 'beta'
              $title = "Mate $version [PRE-RELEASE: $env:GITHUB_REF_NAME]"
          }
          else {
              $version = $env:BASE_VERSION
              $channel = 'win'
              $title = "Mate $version"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "is-prerelease=$($isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "title=$title" >> $env:GITHUB_OUTPUT

      - name: Build Velopack packages
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
          IS_PRERELEASE: ${{ steps.release.outputs.is-prerelease }}
        run: |
          $parameters = @{
              Version = $env:PACKAGE_VERSION
              Channel = $env:RELEASE_CHANNEL
              RepositoryUrl = "https://github.com/$env:GITHUB_REPOSITORY"
          }
          if ($env:IS_PRERELEASE -eq 'true') {
              $parameters.Prerelease = $true
          }

          .\build-velopack.ps1 @parameters

      - name: Store Velopack packages in workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Mate-${{ steps.release.outputs.version }}-velopack
          path: artifacts/velopack/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable GitHub Release
        if: steps.release.outputs.is-prerelease == 'false'
        shell: pwsh
        env:
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          dnx vpk --version $env:VELOPACK_VERSION upload github `
              --repoUrl "https://github.com/$env:GITHUB_REPOSITORY" `
              --outputDir artifacts/velopack `
              --channel $env:RELEASE_CHANNEL `
              --publish `
              --merge `
              --releaseName $env:RELEASE_TITLE `
              --tag $env:RELEASE_TAG `
              --targetCommitish $env:GITHUB_SHA

      - name: Publish test GitHub Pre-release
        if: steps.release.outputs.is-prerelease == 'true'
        shell: pwsh
        env:
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          dnx vpk --version $env:VELOPACK_VERSION upload github `
              --repoUrl "https://github.com/$env:GITHUB_REPOSITORY" `
              --outputDir artifacts/velopack `
              --channel $env:RELEASE_CHANNEL `
              --publish `
              --pre `
              --merge `
              --releaseName $env:RELEASE_TITLE `
              --tag $env:RELEASE_TAG `
              --targetCommitish $env:GITHUB_SHA
