name: Build release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix, for example 1.2.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: mate-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build and publish Mate ${{ inputs.version }}
    runs-on: windows-2025
    timeout-minutes: 20

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate release version
        shell: pwsh
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
              throw 'Version must use the Major.Minor.Patch format, for example 1.2.0.'
          }

      - name: Install Inno Setup 6.7.3
        shell: pwsh
        run: |
          winget install `
              --id JRSoftware.InnoSetup `
              --exact `
              --version 6.7.3 `
              --source winget `
              --silent `
              --force `
              --accept-package-agreements `
              --accept-source-agreements `
              --disable-interactivity

          if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup installation failed with exit code $LASTEXITCODE."
          }

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $installedVersion = (Get-Item -LiteralPath $iscc).VersionInfo.ProductVersion

          if ($installedVersion -notlike '6.7.3*') {
              throw "Expected Inno Setup 6.7.3, found $installedVersion."
          }

          Write-Host "Using Inno Setup $installedVersion"

      - name: Build installer
        shell: pwsh
        run: .\build-installer.ps1 -Version $env:RELEASE_VERSION

      - name: Store installer in workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Mate-Setup-${{ inputs.version }}
          path: artifacts/installer/Mate-Setup-${{ inputs.version }}.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $installer = "artifacts/installer/Mate-Setup-$env:RELEASE_VERSION.exe"

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $tag $installer `
                  --repo $env:GITHUB_REPOSITORY `
                  --clobber
          }
          else {
              gh release create $tag $installer `
                  --repo $env:GITHUB_REPOSITORY `
                  --target $env:GITHUB_SHA `
                  --title "Mate $env:RELEASE_VERSION" `
                  --generate-notes
          }

          if ($LASTEXITCODE -ne 0) {
              throw "GitHub Release publishing failed with exit code $LASTEXITCODE."
          }
